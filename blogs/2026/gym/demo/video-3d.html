<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动作动画预览</title>
<style>
    :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1d2330;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #ff6b35;
        --overlay: rgba(0, 0, 0, 0.55);
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: var(--text);
        background: var(--bg);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #14161a;
            --card: #1e2127;
            --text: #e8eaed;
            --muted: #9aa0a6;
            --line: #2e323a;
        }
    }
    body {
        margin: 0;
        background: var(--bg);
    }
    main {
        max-width: 860px;
        margin: 0 auto;
        padding: 16px;
    }
    h1 {
        font-size: 22px;
        margin: 4px 0;
    }
    .muted {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
    }
    .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        margin-top: 12px;
    }
    .stage canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
    select {
        font: inherit;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        min-width: 240px;
    }
    .hud {
        position: absolute;
        left: 10px;
        top: 10px;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--overlay);
        color: #fff;
        font-size: 14px;
        line-height: 1.5;
    }
    .hud b {
        font-size: 18px;
    }
    .message {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 16px;
        text-align: center;
        padding: 16px;
    }
    .progress {
        height: 6px;
        background: var(--line);
        border-radius: 3px;
        margin-top: 8px;
        overflow: hidden;
    }
    .progress div {
        height: 100%;
        width: 0;
        background: var(--accent);
    }
    .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
    }
    button {
        font: inherit;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
    }
    button.on,
    button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
    }
    button:disabled {
        opacity: 0.5;
        cursor: default;
    }
</style>
</head>
<body>
<main>
    <h1>动作动画预览</h1>
    <div class="muted" id="intro">选一个动作看 3D 人偶示范。计次动作每做完一次换一个视角（太快的动作每几次换一次）：正面 → 侧面 → 全身 → ……</div>
    <div class="row">
        <select id="exercise"></select>
    </div>
    <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <div class="hud" id="hud" hidden>
            <b id="name"></b><br>
            <span id="view-name"></span> · <span id="rep"></span><br>
            <span id="remain"></span>
        </div>
        <div class="message" id="message">正在加载……</div>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="row" id="coach">
        <button type="button" data-coach="female" class="on">女教练</button>
        <button type="button" data-coach="male">男教练</button>
    </div>
    <div class="row" id="side" hidden>
        <button type="button" data-side="left" class="on">左侧</button>
        <button type="button" data-side="right">右侧</button>
    </div>
    <div class="row" id="views">
        <button type="button" data-view="auto" class="on">自动换视角</button>
        <button type="button" data-view="0">视角 1</button>
        <button type="button" data-view="1">视角 2</button>
        <button type="button" data-view="2">视角 3</button>
        <button type="button" id="replay">重播</button>
    </div>
    <ul class="muted" id="cues"></ul>
</main>

<script type="module">
// 加载失败、脚本出错时把原因显示在画面上，而不是一直停在"正在加载"
const message = document.getElementById('message');
function showError(text) {
    message.hidden = false;
    message.textContent = `出错了：${text}（按 F12 打开控制台可看详细信息）`;
}
window.addEventListener('error', (e) => showError(e.message));
window.addEventListener('unhandledrejection', (e) => showError(e.reason?.message ?? String(e.reason)));

// 与跟练播放器用同一套动画代码
const { createStage } = await import('/src/anim/stage.ts');
const { ANIMATIONS } = await import('/src/anim/library.ts');
const { EXERCISES } = await import('/src/data/exercises.ts');
const { viewIndexAt, animCycleSec } = await import('/src/anim/schedule.ts');

const select = document.getElementById('exercise');
const animated = EXERCISES.filter((e) => e.id in ANIMATIONS);
document.getElementById('intro').textContent += `（已做 ${animated.length} / ${EXERCISES.length} 个动作）`;
for (const e of animated) {
    const o = document.createElement('option');
    o.value = e.id;
    o.textContent = e.name;
    select.append(o);
}

const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
const canvas = document.getElementById('canvas');
const stage = createStage(canvas, dark);
window.addEventListener('resize', () => stage.resize());
message.hidden = true;
document.getElementById('hud').hidden = false;

let coach = 'female';
let side = 'left';
let manualView = null;
let startMs = performance.now();
let ex = animated[0];

function load() {
    ex = animated.find((e) => e.id === select.value) ?? animated[0];
    document.getElementById('side').hidden = !ex.perSide;
    stage.setExercise(ex.id, ex.perSide ? side : undefined, coach);
    document.getElementById('name').textContent = ex.name + (ex.perSide ? `（${side === 'left' ? '左' : '右'}侧）` : '');
    document.getElementById('cues').innerHTML = ex.cues.map((c) => `<li>${c}</li>`).join('');
    startMs = performance.now();
}

function total() {
    return ex.mode === 'reps' ? ex.defaultReps * ex.secPerRep : ex.defaultSeconds;
}

function frame(now) {
    requestAnimationFrame(frame);
    const t = ((now - startMs) / 1000) % total();
    const view = manualView ?? viewIndexAt(ex.id, t);
    document.getElementById('view-name').textContent = `视角：${stage.render(t, view)}`;
    document.getElementById('rep').textContent = ex.mode === 'reps'
        ? `第 ${Math.floor(t / animCycleSec(ex.id)) + 1} / ${ex.defaultReps} 次`
        : `${ex.defaultSeconds} 秒`;
    document.getElementById('remain').textContent = `剩余 ${Math.ceil(total() - t)} 秒（循环播放）`;
    document.getElementById('bar').style.width = `${(t / total()) * 100}%`;
}

function toggle(groupId, attr, onPick) {
    document.getElementById(groupId).addEventListener('click', (e) => {
        const btn = e.target.closest(`button[${attr}]`);
        if (!btn)
            return;
        for (const b of document.querySelectorAll(`#${groupId} button[${attr}]`))
            b.classList.toggle('on', b === btn);
        onPick(btn.getAttribute(attr));
    });
}

select.addEventListener('change', load);
toggle('coach', 'data-coach', (v) => {
    coach = v;
    load();
});
toggle('side', 'data-side', (v) => {
    side = v;
    load();
});
toggle('views', 'data-view', (v) => {
    manualView = v === 'auto' ? null : Number(v);
});
document.getElementById('replay').addEventListener('click', () => {
    startMs = performance.now();
});

load();
requestAnimationFrame(frame);
</script>
</body>
</html>
