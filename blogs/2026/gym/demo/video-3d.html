<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 动作指导样例</title>
<style>
    :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1d2330;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #ff6b35;
        --overlay: rgba(0, 0, 0, 0.55);
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: var(--text);
        background: var(--bg);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #14161a;
            --card: #1e2127;
            --text: #e8eaed;
            --muted: #9aa0a6;
            --line: #2e323a;
        }
    }
    body {
        margin: 0;
        background: var(--bg);
    }
    main {
        max-width: 860px;
        margin: 0 auto;
        padding: 16px;
    }
    h1 {
        font-size: 22px;
        margin: 4px 0;
    }
    .muted {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
    }
    .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        margin-top: 12px;
    }
    .stage canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
    .hud {
        position: absolute;
        left: 10px;
        top: 10px;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--overlay);
        color: #fff;
        font-size: 14px;
        line-height: 1.5;
    }
    .hud b {
        font-size: 18px;
    }
    .message {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 16px;
        text-align: center;
        padding: 16px;
    }
    .progress {
        height: 6px;
        background: var(--line);
        border-radius: 3px;
        margin-top: 8px;
        overflow: hidden;
    }
    .progress div {
        height: 100%;
        width: 0;
        background: var(--accent);
    }
    .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
    }
    button {
        font: inherit;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
    }
    button.on,
    button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
    }
    button:disabled {
        opacity: 0.5;
        cursor: default;
    }
</style>
</head>
<body>
<main>
    <h1>3D 动作指导样例 · 徒手深蹲</h1>
    <div class="muted">
        深蹲 20 次，每次 3 秒，共 60 秒。每做完一次换一个视角：正面 → 侧面 → 全身 → 正面 ……
        每次都从站直开始、回到站直结束，所以换视角时动作是连贯的。
    </div>
    <div class="stage" id="stage">
        <div class="hud" id="hud" hidden>
            <b>徒手深蹲</b><br>
            <span id="view-name"></span> · <span id="rep"></span><br>
            <span id="remain"></span>
        </div>
        <div class="message" id="message">正在加载……</div>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="row" id="coach">
        <button type="button" data-coach="female" class="on">女教练</button>
        <button type="button" data-coach="male">男教练</button>
    </div>
    <div class="row" id="views">
        <button type="button" data-view="auto" class="on">每次换视角</button>
        <button type="button" data-view="0">只看正面</button>
        <button type="button" data-view="1">只看侧面</button>
        <button type="button" data-view="2">只看全身</button>
    </div>
    <div class="row">
        <button type="button" id="replay">重播</button>
        <button type="button" id="export" class="primary" disabled>导出 3 个片段（每个视角一次深蹲）</button>
    </div>
    <div class="muted" id="export-note" style="margin-top: 8px">
        导出的文件放到 <code id="export-dir">src/videos/female/squat/</code>，跟练时会自动按次拼接。
    </div>
    <div class="muted" style="margin-top: 8px">人物模型：three.js 官方示例中的 Michelle（女）和 Soldier（男，原模型是士兵造型），均来自 Mixamo，仅用于效果演示。</div>
</main>

<script type="module">
// 加载失败、脚本出错时把原因显示在画面上，而不是一直停在"正在加载"
const message = document.getElementById('message');
function showError(text) {
    message.hidden = false;
    message.textContent = `出错了：${text}（按 F12 打开控制台可看详细信息）`;
}
window.addEventListener('error', (e) => showError(e.message));
window.addEventListener('unhandledrejection', (e) => showError(e.reason?.message ?? String(e.reason)));
message.textContent = '正在加载 3D 引擎……';

const THREE = await import('three');
const { GLTFLoader } = await import('three/examples/jsm/loaders/GLTFLoader.js');
const { RoomEnvironment } = await import('three/examples/jsm/environments/RoomEnvironment.js');
const { createSquatRig, faceForward, squatDepth } = await import('./squat-rig.js');

// 模型放在本地 demo/models/，不依赖外网 CDN
const MODELS = {
    female: new URL('./models/female.glb', import.meta.url).href,
    male: new URL('./models/male.glb', import.meta.url).href,
};
const REPS = 20;
const REP_SEC = 3;              // 与动作库里深蹲的 secPerRep 一致
const TOTAL_SEC = REPS * REP_SEC;

// 正面 / 侧面 / 全身：人物面朝 +z，侧面机位在人物左侧（+x）。坐标按 1.7 米身高，加载后按实际身高缩放
const VIEWS = [
    { id: 'front', name: '正面', pos: [0, 0.95, 3.8], target: [0, 0.82, 0] },
    { id: 'side', name: '侧面', pos: [3.8, 0.95, 0.05], target: [0, 0.82, 0.05] },
    { id: 'full', name: '全身', pos: [2.4, 2.5, 3.0], target: [0, 0.66, 0] },
];

const stage = document.getElementById('stage');
const hud = document.getElementById('hud');
const viewNameEl = document.getElementById('view-name');
const repEl = document.getElementById('rep');
const remainEl = document.getElementById('remain');
const barEl = document.getElementById('bar');
const exportBtn = document.getElementById('export');
const exportNote = document.getElementById('export-note');
const exportDir = document.getElementById('export-dir');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecef);
scene.fog = new THREE.Fog(0xe9ecef, 8, 16);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

scene.add(new THREE.HemisphereLight(0xffffff, 0xb0b4ba, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(2.5, 5, 3.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -2;
key.shadow.camera.right = 2;
key.shadow.camera.top = 2.5;
key.shadow.camera.bottom = -1;
key.shadow.radius = 4;
key.shadow.bias = -0.0005;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.6);
fill.position.set(-3, 2, -2);
scene.add(fill);

// 地板 + 瑜伽垫
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    new THREE.MeshStandardMaterial({ color: 0xd9dce0, roughness: 0.9 }),
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const mat = new THREE.Mesh(
    new THREE.BoxGeometry(0.66, 0.008, 1.8),
    new THREE.MeshStandardMaterial({ color: 0x3d5a80, roughness: 0.7 }),
);
mat.position.set(0, 0.004, 0.1);
mat.receiveShadow = true;
scene.add(mat);

const camera = new THREE.PerspectiveCamera(30, 16 / 9, 0.1, 50);

function resize() {
    renderer.setSize(stage.clientWidth, stage.clientHeight, false);
}
window.addEventListener('resize', resize);
resize();

let rig = null;
let model = null;
let coach = 'female';
const cache = {};

function useView(i) {
    const v = VIEWS[i];
    const k = rig ? rig.height / 1.7 : 1;
    camera.position.set(v.pos[0] * k, v.pos[1] * k, v.pos[2] * k);
    camera.lookAt(v.target[0] * k, v.target[1] * k, v.target[2] * k);
    viewNameEl.textContent = `视角：${v.name}`;
}

// ---------- 加载人物（女 / 男），加载过的直接复用 ----------
async function loadCoach(which) {
    exportBtn.disabled = true;
    if (!cache[which]) {
        message.hidden = false;
        message.textContent = '正在加载人物模型……';
        const gltf = await new GLTFLoader().loadAsync(MODELS[which], (e) => {
            if (e.total)
                message.textContent = `正在加载人物模型…… ${Math.round((e.loaded / e.total) * 100)}%`;
        });
        const m = gltf.scene;
        m.traverse((o) => {
            if (o.isMesh) {
                o.castShadow = true;
                o.receiveShadow = true;
                o.frustumCulled = false;
            }
        });
        // 先摆成 T 姿态，作为骨骼"对准"的起点
        const tpose = gltf.animations.find((a) => a.name === 'TPose');
        if (tpose) {
            const mixer = new THREE.AnimationMixer(m);
            mixer.clipAction(tpose).play();
            mixer.update(0);
            mixer.stopAllAction();
        }
        faceForward(THREE, m);
        const r = createSquatRig(THREE, m);
        m.position.y -= r.floorY;
        m.updateMatrixWorld(true);
        cache[which] = { model: m, rig: r };
    }
    if (model)
        scene.remove(model);
    ({ model, rig } = cache[which]);
    scene.add(model);
    coach = which;
    exportDir.textContent = `src/videos/${which}/squat/`;
    message.hidden = true;
    hud.hidden = false;
    exportBtn.disabled = false;
}

// ---------- 时间轴 ----------
let manualView = null;
let startMs = performance.now();
let recording = null;           // 导出时：{ view, startMs }

function frame(now) {
    requestAnimationFrame(frame);
    if (!rig)
        return;
    let t;
    let viewIndex;
    if (recording) {
        t = Math.min((now - recording.startMs) / 1000, REP_SEC);
        viewIndex = recording.view;
    } else {
        t = Math.min((now - startMs) / 1000, TOTAL_SEC);
        const rep = Math.min(Math.floor(t / REP_SEC), REPS - 1);
        viewIndex = manualView ?? rep % VIEWS.length;
        repEl.textContent = `第 ${rep + 1} / ${REPS} 次`;
        remainEl.textContent = t >= TOTAL_SEC ? '完成' : `剩余 ${Math.ceil(TOTAL_SEC - t)} 秒`;
        barEl.style.width = `${(t / TOTAL_SEC) * 100}%`;
    }
    const phase = t >= (recording ? REP_SEC : TOTAL_SEC) ? 0 : (t % REP_SEC) / REP_SEC;
    rig.pose(squatDepth(phase));
    useView(viewIndex);
    renderer.render(scene, camera);
}
requestAnimationFrame(frame);

document.getElementById('replay').addEventListener('click', () => {
    startMs = performance.now();
});

document.getElementById('views').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn)
        return;
    const v = btn.dataset.view;
    manualView = v === 'auto' ? null : Number(v);
    for (const b of document.querySelectorAll('#views button'))
        b.classList.toggle('on', b === btn);
});

document.getElementById('coach').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn || recording || btn.dataset.coach === coach)
        return;
    for (const b of document.querySelectorAll('#coach button'))
        b.classList.toggle('on', b === btn);
    await loadCoach(btn.dataset.coach);
    startMs = performance.now();
});

// ---------- 导出片段：每个视角录一次深蹲（站直 → 蹲下 → 站直），1280×720 ----------
function pickMime() {
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    return types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
}

function recordView(view, mime) {
    return new Promise((resolve) => {
        const stream = renderer.domElement.captureStream(30);
        const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4_000_000 });
        const chunks = [];
        rec.ondataavailable = (e) => chunks.push(e.data);
        rec.onstop = () => resolve(new Blob(chunks, { type: mime }));
        rec.start();
        recording = { view, startMs: performance.now() };
        setTimeout(() => rec.stop(), REP_SEC * 1000 + 50);
    });
}

function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

exportBtn.addEventListener('click', async () => {
    const mime = pickMime();
    if (!mime) {
        exportNote.textContent = '这个浏览器不支持录制，请用最新版 Chrome 或 Edge。';
        return;
    }
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    exportBtn.disabled = true;
    renderer.setPixelRatio(1);
    renderer.setSize(1280, 720, false);
    for (let i = 0; i < VIEWS.length; i++) {
        exportNote.textContent = `正在录制 ${VIEWS[i].name}（${i + 1} / ${VIEWS.length}）……`;
        const blob = await recordView(i, mime);
        download(blob, `${VIEWS[i].id}.${ext}`);
    }
    recording = null;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    resize();
    exportBtn.disabled = false;
    exportNote.textContent = `已导出 front.${ext} / side.${ext} / full.${ext}，放到 src/videos/${coach}/squat/ 即可在跟练里看到。`;
});

await loadCoach('female');
startMs = performance.now();
</script>
</body>
</html>
