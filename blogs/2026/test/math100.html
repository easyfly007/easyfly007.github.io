<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>口算练习 100 题</title>
<style>
  :root {
    --bg: #fdf8ef;
    --card: #ffffff;
    --ink: #2d2a26;
    --muted: #8a8378;
    --line: #e8dfcf;
    --accent: #ff8a3d;
    --accent-ink: #ffffff;
    --ok: #2f9e5b;
    --ok-bg: #e6f6ec;
    --bad: #d6453d;
    --bad-bg: #fdeceb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
  }
  .bar {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    justify-content: space-between;
  }
  h1 { margin: 0; font-size: 22px; }
  .score { font-size: 16px; color: var(--muted); }
  .score b { color: var(--ink); font-size: 20px; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  .tip { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .groups {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .group {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px 14px;
  }
  .group.allok { border-color: var(--ok); }
  .group h2 {
    margin: 0 0 8px;
    font-size: 14px;
    color: var(--muted);
    font-weight: normal;
    display: flex;
    justify-content: space-between;
  }
  .q {
    display: grid;
    grid-template-columns: 34px 1fr 72px 26px;
    align-items: center;
    gap: 6px;
    padding: 6px 4px;
    border-radius: 8px;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
  }
  .q .no { font-size: 13px; color: var(--muted); }
  .q .expr { white-space: nowrap; }
  .q input {
    width: 100%;
    font-size: 22px;
    padding: 4px 6px;
    text-align: center;
    border: 2px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .q input:focus { outline: none; border-color: var(--accent); }
  .q .mark { font-size: 20px; text-align: center; }
  .q input.empty { border-color: var(--accent); border-style: dashed; background: #fff5ec; }
  .warn { color: var(--accent); font-weight: bold; }
  .q.ok { background: var(--ok-bg); }
  .q.ok input { border-color: var(--ok); }
  .q.ok .mark { color: var(--ok); }
  .q.bad { background: var(--bad-bg); }
  .q.bad input { border-color: var(--bad); }
  .q.bad .mark { color: var(--bad); }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  button {
    font: inherit;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-ink);
  }
  button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
  }
  button:active { transform: translateY(1px); }
  .result { font-size: 15px; margin-left: auto; align-self: center; text-align: right; }
  .grade {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: bold;
    color: #fff;
  }
  .grade.fail { background: var(--bad); }
  .grade.pass { background: #e0a100; }
  .grade.good { background: #3b82c4; }
  .grade.great { background: var(--ok); }
  .grade.perfect { background: linear-gradient(90deg, #ff8a3d, #e5487a); }
  .done .grade { font-size: 22px; padding: 4px 16px; }
  .done {
    display: none;
    text-align: center;
    font-size: 22px;
    margin: 24px 0 8px;
  }
  @media print {
    header button, .actions, .tip { display: none; }
    header { position: static; }
    .group { break-inside: avoid; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>口算练习 100 题</h1>
    <div class="score">已检查 <b id="checked">0</b>/100 · 答对 <b id="right">0</b></div>
    <button class="ghost" id="newSet">换一套题</button>
  </div>
</header>
<main>
  <p class="tip">九九乘法 40 题 + 两位数加法 30 题 + 两位数减法 30 题，随机混排。每 5 题做完点「检查」，做错的可以改了再检查。输完一题按回车跳到下一题。</p>
  <div class="groups" id="groups"></div>
  <div class="done" id="done"></div>
</main>
<script>
function rand(lo, hi) {
  return lo + Math.floor(Math.random() * (hi - lo + 1));
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 生成不重复的题目；mul 尽量避开 ×1，add 和 ≤ 99，sub 结果 ≥ 0
function makeQuestions() {
  const seen = new Set();
  const list = [];
  function add(q) {
    const key = q.text;
    if (seen.has(key))
      return false;
    seen.add(key);
    list.push(q);
    return true;
  }
  let n = 0;
  while (n < 40) {
    const a = rand(2, 9);
    const b = rand(2, 9);
    if (add({ text: a + ' × ' + b, ans: a * b }))
      n++;
  }
  n = 0;
  while (n < 30) {
    const a = rand(10, 89);
    const b = rand(10, 99 - a);
    if (b < 10)
      continue;
    if (add({ text: a + ' + ' + b, ans: a + b }))
      n++;
  }
  n = 0;
  while (n < 30) {
    const a = rand(20, 99);
    const b = rand(10, a);
    if (add({ text: a + ' − ' + b, ans: a - b }))
      n++;
  }
  return shuffle(list);
}

const groupsEl = document.getElementById('groups');
let questions = [];
const status = [];   // 每题：null 未检查 / true 对 / false 错

function render() {
  questions = makeQuestions();
  status.length = 0;
  for (let i = 0; i < 100; i++)
    status.push(null);
  groupsEl.innerHTML = '';
  for (let g = 0; g < 20; g++) {
    const box = document.createElement('section');
    box.className = 'group';
    box.innerHTML = '<h2><span>第 ' + (g + 1) + ' 组</span><span>' + (g * 5 + 1) + '–' + (g * 5 + 5) + ' 题</span></h2>';
    for (let k = 0; k < 5; k++) {
      const i = g * 5 + k;
      const row = document.createElement('div');
      row.className = 'q';
      row.innerHTML =
        '<span class="no">' + (i + 1) + '.</span>' +
        '<span class="expr">' + questions[i].text + ' =</span>' +
        '<input type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" ' +
        'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ' +
        'maxlength="3" data-i="' + i + '">' +
        '<span class="mark"></span>';
      box.appendChild(row);
    }
    const act = document.createElement('div');
    act.className = 'actions';
    act.innerHTML =
      '<button data-check="' + g + '">检查</button>' +
      '<span class="result"></span>';
    box.appendChild(act);
    groupsEl.appendChild(box);
  }
  updateScore();
  window.scrollTo(0, 0);
}

function rowOf(i) {
  return groupsEl.querySelector('input[data-i="' + i + '"]').parentElement;
}

// 一组 5 题必须全部写完才判对错、打分；有空着的只提示，不评估
function checkGroup(g) {
  const box = groupsEl.children[g];
  const res = box.querySelector('.result');
  const inputs = [];
  let firstBlank = null;
  for (let k = 0; k < 5; k++) {
    const input = rowOf(g * 5 + k).querySelector('input');
    inputs.push(input);
    input.classList.remove('empty');
    if (input.value.trim() === '') {
      input.classList.add('empty');
      if (firstBlank === null)
        firstBlank = input;
    }
  }
  if (firstBlank !== null) {
    const blank = inputs.filter(function (el) {
      return el.value.trim() === '';
    }).length;
    for (let k = 0; k < 5; k++) {
      const i = g * 5 + k;
      const row = rowOf(i);
      status[i] = null;
      row.classList.remove('ok', 'bad');
      row.querySelector('.mark').textContent = '';
    }
    box.classList.remove('allok');
    res.innerHTML = '<span class="warn">还有 ' + blank + ' 题没做完，做完才能打分哦</span>';
    firstBlank.focus();
    updateScore();
    return false;
  }
  let right = 0;
  for (let k = 0; k < 5; k++) {
    const i = g * 5 + k;
    const row = rowOf(i);
    const ok = Number(inputs[k].value) === questions[i].ans;
    status[i] = ok;
    row.classList.remove('ok', 'bad');
    row.classList.add(ok ? 'ok' : 'bad');
    row.querySelector('.mark').textContent = ok ? '✓' : '✗';
    if (ok)
      right++;
  }
  res.innerHTML = gradeHtml(right * 20);
  box.classList.toggle('allok', right === 5);
  updateScore();
  return true;
}

// 按正确率评等级：满分 太棒了，≥90 优秀，≥80 良好，≥60 及格，<60 不及格
function grade(score) {
  if (score === 100)
    return { text: '太棒了！🎉', cls: 'perfect' };
  if (score >= 90)
    return { text: '优秀', cls: 'great' };
  if (score >= 80)
    return { text: '良好', cls: 'good' };
  if (score >= 60)
    return { text: '及格', cls: 'pass' };
  return { text: '不及格', cls: 'fail' };
}

function gradeHtml(score) {
  const g = grade(score);
  return score + ' 分 <span class="grade ' + g.cls + '">' + g.text + '</span>';
}

function updateScore() {
  let checked = 0;
  let right = 0;
  for (const s of status) {
    if (s !== null)
      checked++;
    if (s === true)
      right++;
  }
  document.getElementById('checked').textContent = checked;
  document.getElementById('right').textContent = right;
  const done = document.getElementById('done');
  if (checked === 100) {
    done.style.display = 'block';
    done.innerHTML = '100 题总成绩：' + gradeHtml(right);
  } else {
    done.style.display = 'none';
  }
}

groupsEl.addEventListener('click', function (e) {
  const t = e.target;
  if (t.dataset.check !== undefined)
    checkGroup(Number(t.dataset.check));
});

// 只允许输入数字：全角数字转成半角，其余字符（字母、汉字、表情、空格等）一律去掉
function digitsOnly(el) {
  const v = el.value
    .replace(/[０-９]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    })
    .replace(/[^0-9]/g, '')
    .slice(0, 3);
  if (v !== el.value)
    el.value = v;
}

// 键入或粘贴非数字时直接拦下；输入法拼字过程中不拦，等拼完再清理
groupsEl.addEventListener('beforeinput', function (e) {
  if (e.target.tagName !== 'INPUT' || e.isComposing || e.data == null)
    return;
  if (/[^0-9０-９]/.test(e.data))
    e.preventDefault();
});

groupsEl.addEventListener('input', function (e) {
  if (e.target.tagName !== 'INPUT' || e.isComposing)
    return;
  digitsOnly(e.target);
  if (e.target.value !== '')
    e.target.classList.remove('empty');
});

groupsEl.addEventListener('compositionend', function (e) {
  if (e.target.tagName !== 'INPUT')
    return;
  digitsOnly(e.target);
});

// 回车跳到下一题，每组第 5 题回车直接检查

groupsEl.addEventListener('keydown', function (e) {
  if (e.target.tagName !== 'INPUT' || e.key !== 'Enter')
    return;
  e.preventDefault();
  const i = Number(e.target.dataset.i);
  if (i % 5 === 4 && !checkGroup(Math.floor(i / 5)))
    return;
  if (i < 99)
    groupsEl.querySelector('input[data-i="' + (i + 1) + '"]').focus();
});

document.getElementById('newSet').addEventListener('click', function () {
  if (confirm('换一套新题？当前的答案会清空。'))
    render();
});

render();
</script>
</body>
</html>
